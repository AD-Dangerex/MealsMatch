{% extends "base.html" %}
{% block title %}Choose a new password | Meals Match{% endblock %}
{% block content %}
<section class="page-shell auth-shell">
    <div class="auth-card">
        <div class="section-label">ACCOUNT RECOVERY</div>
        <h1>Choose a new password.</h1>
        <p class="form-intro">Choose a strong password you have not used for another account. This reset link can only be used once.</p>
        <form method="post" class="stacked-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>New password
                <input type="password" name="password" minlength="10" autocomplete="new-password" required>
                <small>Use at least 10 characters.</small>
            </label>
            <label>Confirm new password
                <input type="password" name="confirm_password" minlength="10" autocomplete="new-password" required>
            </label>
            <button type="submit" class="primary-button form-submit">Update password</button>
        </form>
    </div>
</section>
{% endblock %}
